<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Riefa</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #ffe3d3;
  --dot: #ffcdbb;
  --pink: #ff9fb8;
  --pink-deep: #d9577d;
  --cream: #fff8f1;
  --butter: #ffe9a8;
  --ink: #6b2f45;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 2.5px, transparent 2.5px);
  background-size: 22px 22px;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 16px;
}

.wrap {
  width: 100%;
  max-width: 900px;
}

.judul {
  text-align: center;
  margin-bottom: 30px;
}

.judul h1 {
  display: inline-block;
  font-size: 2.2rem;
  font-weight: 600;
  background: var(--pink);
  color: #fff;
  padding: 8px 30px;
  border: 4px solid var(--ink);
  border-radius: 40px 50px 44px 52px;
  box-shadow: 6px 6px 0 var(--ink);
  transform: rotate(-2deg);
}

.sub {
  text-align: center;
  font-family: 'Caveat', cursive;
  font-size: 1.6rem;
  color: var(--pink-deep);
  margin-bottom: 34px;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 28px;
}

.menu-card {
  position: relative;
  display: block;
  text-decoration: none;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 8px 28px 8px 28px;
  padding: 34px 22px 24px;
  box-shadow: 6px 6px 0 var(--pink);
  transition: transform .2s;
}

.menu-card:nth-child(1) {
  transform: rotate(-1.5deg);
}

.menu-card:nth-child(2) {
  transform: rotate(1.5deg);
  background: #fff0f3;
}

.menu-card:nth-child(3) {
  transform: rotate(1deg);
  background: #fff0f3;
}

.menu-card:nth-child(4) {
  transform: rotate(-1deg);
}

.menu-card:hover {
  transform: rotate(0) scale(1.03);
}

.tape {
  position: absolute;
  top: -14px;
  left: 50%;
  width: 80px;
  height: 26px;
  background: repeating-linear-gradient(45deg, var(--butter) 0 8px, #ffdf85 8px 16px);
  opacity: .9;
  transform: translateX(-50%) rotate(-4deg);
}

.emoji {
  font-size: 2.6rem;
}

.menu-card h3 {
  font-size: 1.3rem;
  margin: 8px 0 4px;
}

.menu-card p {
  font-family: 'Caveat', cursive;
  font-size: 1.35rem;
  color: var(--pink-deep);
}

.footer {
  margin-top: 40px;
  text-align: center;
  font-family: 'Caveat', cursive;
  font-size: 1.4rem;
  color: var(--pink-deep);
}

@media (max-width: 640px) {
  .menu-grid {
    grid-template-columns: 1fr;
  }

  .judul h1 {
    font-size: 1.7rem;
  }
}
</style>
</head>

<body>
  <div class="wrap">

    <div class="judul">
      <h1>Halaman Riefa</h1>
    </div>

    <p class="sub">pilih menu yang mau kamu buka yuk! 💖</p>

    <div class="menu-grid">

      <a class="menu-card" href="biodata-diri.html">
        <i class="tape"></i>
        <div class="emoji">📒</div>
        <h3>Biodata Diri</h3>
        <p>kenalan sama aku yuk</p>
      </a>

      <a class="menu-card" href="form-biodata.html">
        <i class="tape"></i>
        <div class="emoji">✏️</div>
        <h3>Form Pengisian Biodata</h3>
        <p>isi datamu di sini</p>
      </a>

      <a class="menu-card" href="survei-ovo.html">
        <i class="tape"></i>
        <div class="emoji">⭐</div>
        <h3>Survei Kepuasan e-Wallet OVO</h3>
        <p>puas nggak sama OVO?</p>
      </a>

      <a class="menu-card" href="tugas-akhir.html">
        <i class="tape"></i>
        <div class="emoji">🎓</div>
        <h3>Tugas Akhir</h3>
        <p>pantau progres tugas akhirmu</p>
      </a>

    </div>

    <div class="footer">
      &copy; 2026 Riefa Andrianie Kurnia Putri
    </div>

  </div>
</body>
</html>
